<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KNOX PLAYER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Shippori+Mincho:wght@500;600&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0c;--surface:#141416;--surface-2:#1e1e22;--border:#2a2a2f;--text:#e8e8eb;--text-dim:#a0a0a6;--accent:#dc143c;--accent-strong:#b8102a;--accent-ink:#fff5f6;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans JP",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;padding:0;overflow:hidden;}
  /* スマホはアドレスバーの分だけ画面が縮むので dvh を使う。対応してない端末は vh に落ちる */
  .app{display:flex;height:100vh;height:100dvh;height:100svh;flex-direction:column;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 18px;border-bottom:1px solid var(--border);background:var(--surface);}
  .brand-mark{font-family:"Cinzel",serif;font-weight:700;font-size:20px;letter-spacing:.08em;color:var(--accent);}
  .topbar-btns{display:flex;gap:8px;}
  .btn{appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:8px 13px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s;}
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn-accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .main-layout{display:flex;flex:1;min-height:0;}
  .sidebar{width:260px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;}
  .sidebar-scroll{flex:1;overflow-y:auto;padding:12px 8px;}
  .sidebar-footer{padding:8px;border-top:1px solid var(--border);}
  .album-group{margin-bottom:12px;}
  .album-header{display:flex;align-items:center;gap:6px;padding:8px 10px;font-size:12px;font-weight:600;color:var(--text-dim);cursor:pointer;user-select:none;}
  .album-header:hover{color:var(--text);}
  .album-toggle{width:16px;display:flex;align-items:center;justify-content:center;font-size:11px;transition:transform .2s;}
  .album-toggle.open{transform:rotate(90deg);}
  .album-title{flex:1;}
  .tracks-in-album{max-height:0;overflow:hidden;transition:max-height .3s;}
  .tracks-in-album.open{max-height:2000px;}
  .track-item{padding:6px 8px;border-radius:6px;font-size:12.5px;color:var(--text-dim);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all .12s;display:flex;justify-content:space-between;align-items:center;}
  .track-item:hover{background:var(--surface-2);color:var(--text);}
  .track-item.active{background:var(--accent);color:var(--accent-ink);font-weight:600;}
  .track-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;}
  .track-edit{cursor:pointer;opacity:0;transition:opacity .12s;padding:2px 6px;}
  .pl-add{cursor:pointer;padding:0 6px;font-size:15px;color:var(--text-dim);}
  .pl-add:hover{color:var(--accent);}
  .pl-empty{font-size:11px;color:var(--text-dim);padding:4px 10px;}
  .drop-target{outline:2px dashed var(--accent);outline-offset:-2px;background:rgba(220,20,60,.12);border-radius:6px;}
  body.dragging-track .album-header{background:rgba(255,255,255,.03);border-radius:6px;}
  body.dragging-track .track-item{cursor:grabbing;}
  .pl-note{font-size:11px;color:var(--accent);background:rgba(220,20,60,.08);border:1px solid var(--accent);border-radius:6px;padding:8px 10px;margin:0 2px 12px;line-height:1.7;}
  .track-item:hover .track-edit{opacity:1;}
  .main-content{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  .stage{flex:1;display:flex;flex-direction:row;gap:18px;padding:20px;min-height:0;overflow:hidden;}
  .now-panel{width:330px;flex:0 0 auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:11px;overflow-y:auto;}
  .panel-cover{width:100%;aspect-ratio:1/1;max-width:100%;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-strong));background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;}
  .panel-cover span{font-size:56px;color:var(--accent-ink);opacity:.55;}
  .panel-badge{display:flex;align-items:center;gap:8px;font-family:"Cinzel",serif;font-size:11px;letter-spacing:.2em;color:var(--accent);}
  .panel-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1.6s ease-in-out infinite;flex:0 0 auto;}
  .panel-badge.idle{color:var(--text-dim);}
  .panel-badge.idle .dot{background:var(--text-dim);animation:none;}
  .panel-title{font-family:"Cinzel",serif;font-size:23px;font-weight:700;line-height:1.3;color:var(--text);word-break:break-word;}
  .panel-album{font-size:12px;color:var(--text-dim);margin-top:-6px;}
  .panel-play{justify-content:center;padding:11px;font-size:13.5px;font-weight:700;}
  .panel-meta{font-size:11.5px;color:var(--text-dim);line-height:1.85;border-top:1px solid var(--border);padding-top:10px;}
  .panel-tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:10px;}
  .panel-tools .btn{font-size:11px;padding:5px 9px;}
  .panel-info{display:flex;flex-direction:column;gap:11px;flex:1;min-width:0;}
  .menu-btn{display:none;padding:7px 11px;font-size:15px;line-height:1;}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:55;display:none;}
  .scrim.open{display:block;}

  .stage-empty{margin:auto;text-align:center;color:var(--text-dim);}
  .stage-empty h2{font-family:"Cinzel",serif;font-size:18px;color:var(--text);margin:0 0 8px;}
  .now-playing{display:flex;gap:16px;background:var(--surface);border-radius:12px;padding:16px;border:1px solid var(--border);position:relative;}
  .now-cover{width:72px;height:72px;border-radius:10px;flex:0 0 auto;background:linear-gradient(135deg,var(--accent),var(--accent-strong));background-size:cover;background-position:center;}
  .now-meta{flex:1;}
  .now-title{font-family:"Cinzel",serif;font-size:20px;font-weight:600;color:var(--text);margin:0 0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .now-album{font-size:12px;color:var(--text-dim);margin:0;}
  .now-actions{position:absolute;top:16px;right:16px;display:flex;gap:6px;}
  .now-actions .btn{padding:4px 8px;font-size:11px;}
  .lyrics-stage{flex:1;position:relative;border-radius:12px;background:var(--surface);border:1px solid var(--border);overflow:hidden;}
  .lyrics-viewport{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;overflow:hidden;}
  .lyrics-track{display:flex;flex-direction:column;align-items:center;transition:transform .35s cubic-bezier(.22,.9,.32,1);width:100%;padding:38vh 20px;will-change:transform;}
  .lyrics-line{font-family:"Shippori Mincho",serif;font-size:24px;line-height:1.95;color:var(--text);opacity:.28;transition:opacity .35s;text-align:center;width:100%;cursor:text;user-select:text;}
  .lyrics-line.near{opacity:.58;}
  .lyrics-line.current{opacity:1;font-size:34px;font-weight:700;color:var(--accent);}
  .lyrics-line.upcoming{opacity:1;font-size:34px;font-weight:700;color:var(--text);}
  .lyrics-fade{position:absolute;left:0;right:0;height:48px;pointer-events:none;z-index:10;}
  .lyrics-fade.top{top:0;background:linear-gradient(var(--surface),transparent);}
  .lyrics-fade.bottom{bottom:0;background:linear-gradient(transparent,var(--surface));}
  .lyrics-none{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:0 16px;color:var(--text-dim);}
  .interlude-badge{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:10px;z-index:11;font-family:"Cinzel",serif;font-size:15px;letter-spacing:.2em;color:var(--accent);background:var(--surface);border:1px solid var(--accent);border-radius:999px;padding:9px 22px;animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.45;}50%{opacity:1;}}
  .transport{background:var(--surface);border-top:1px solid var(--border);padding:14px 18px;display:flex;flex-direction:column;gap:10px;}
  .seek-row{display:flex;align-items:center;gap:8px;}
  .time-label{font-size:11px;color:var(--text-dim);font-variant-numeric:tabular-nums;width:32px;}
  .time-label.end{text-align:right;}
  input[type="range"]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:2px;background:var(--border);outline:none;}
  input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent);cursor:pointer;}
  input[type="range"]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--accent);border:none;cursor:pointer;}
  .controls-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .transport-btns{display:flex;align-items:center;gap:8px;}
  .play-btn{width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:none;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .play-btn:hover{background:var(--accent-strong);}
  .skip-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .skip-btn:hover{border-color:var(--accent);color:var(--accent);}
  .vol-row{display:flex;align-items:center;gap:8px;color:var(--text-dim);font-size:12px;}
  .vol-row input{width:80px;}
  .dropzone-hint{width:100%;border:1.5px dashed var(--border);border-radius:8px;padding:10px 8px;text-align:center;color:var(--text-dim);font-size:11.5px;cursor:pointer;background:transparent;font-family:inherit;}
  .dropzone-hint:hover{border-color:var(--accent);color:var(--accent);}
  .ver-label{text-align:center;font-size:10px;color:var(--text-dim);opacity:.6;padding-top:6px;letter-spacing:.05em;}
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:100;}
  .modal-backdrop.open{display:flex;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;width:90%;max-width:520px;max-height:80vh;overflow-y:auto;padding:20px;}
  .modal h2{font-family:"Cinzel",serif;font-size:17px;margin:0 0 14px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--text-dim);font-weight:600;margin-bottom:4px;}
  .field input,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-family:inherit;font-size:13px;}
  .field textarea{min-height:120px;resize:vertical;font-family:"Noto Sans JP",monospace;}
  .field-buttons{display:flex;gap:6px;margin-top:4px;}
  .field-buttons .btn{flex:1;font-size:11px;padding:6px 8px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  .sync-overlay{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:90;}
  .sync-overlay.open{display:flex;}
  .sync-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);}
  .sync-head h2{font-family:"Cinzel",serif;font-size:15px;margin:0;}
  .sync-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:20px;}
  .sync-hint{font-size:12px;color:var(--text-dim);letter-spacing:.05em;}
  .sync-stage{position:relative;width:100%;max-width:680px;height:230px;overflow:hidden;}
  .sync-stage::before,.sync-stage::after{content:"";position:absolute;left:0;right:0;height:60px;pointer-events:none;z-index:2;}
  .sync-stage::before{top:0;background:linear-gradient(var(--bg),transparent);}
  .sync-stage::after{bottom:0;background:linear-gradient(transparent,var(--bg));}
  .sync-track{display:flex;flex-direction:column;align-items:center;width:100%;padding:115px 20px;transition:transform .3s cubic-bezier(.22,.9,.32,1);}
  #syncTrack .lyrics-line{opacity:1;color:var(--text);}
  #syncTrack .lyrics-line.near{opacity:1;}
  #syncTrack .lyrics-line{font-size:20px;}
  #syncTrack .lyrics-line.current{font-size:28px;}
  #syncTrack .lyrics-line.upcoming{font-size:20px;font-weight:500;color:var(--text);}
  #syncTrack .lyrics-line.current::before{content:"▶";color:var(--accent);font-size:16px;margin-right:16px;vertical-align:middle;}
  .sync-tap{width:160px;height:160px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:none;cursor:pointer;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .sync-tap:active{transform:scale(.96);}
  .sync-foot{display:flex;justify-content:center;gap:8px;padding:16px 18px 20px;}
  .sync-progress{font-size:11px;color:var(--text-dim);text-align:center;padding:8px 18px;}
  .drop-overlay{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(220,20,60,.12);pointer-events:none;}
  .drop-overlay.active{display:flex;}
  .drop-overlay-inner{border:3px dashed var(--accent);border-radius:18px;background:var(--surface);padding:32px 40px;text-align:center;}
  .drop-overlay-inner strong{display:block;font-family:"Cinzel",serif;font-size:24px;color:var(--accent);margin-bottom:6px;}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--surface);border:1px solid var(--border);padding:12px 16px;border-radius:8px;font-size:12px;color:var(--text);z-index:1000;animation:slideIn .3s;}
  @keyframes slideIn{from{transform:translateX(400px);opacity:0;}to{transform:translateX(0);opacity:1;}}
  @media(max-width:760px){
    .menu-btn{display:inline-flex;}
    .topbar{padding:10px 12px;gap:8px;}
    .brand-mark{font-size:16px;}
    .topbar-btns{gap:6px;}
    .topbar-btns .btn{padding:7px 9px;font-size:11.5px;}
    .sidebar{position:fixed;top:0;bottom:0;left:0;width:78%;max-width:300px;z-index:60;
             transform:translateX(-100%);transition:transform .25s ease;box-shadow:0 0 40px rgba(0,0,0,.6);}
    .sidebar.open{transform:translateX(0);}
    .track-item{padding:11px 10px;font-size:14px;}
    .track-edit{opacity:1;padding:4px 8px;}
    .album-header{padding:10px;font-size:13px;}
    .stage{flex-direction:column;padding:12px;gap:12px;overflow:hidden;}
    .now-panel{width:auto;flex:0 0 auto;flex-direction:row;align-items:center;gap:12px;padding:12px;}
    .panel-cover{width:64px;height:64px;flex:0 0 auto;aspect-ratio:auto;border-radius:8px;}
    .panel-cover span{font-size:26px;}
    .panel-info{gap:4px;}
    .panel-title{font-size:16px;}
    .panel-album{margin-top:0;font-size:11px;}
    .panel-badge{font-size:9.5px;}
    .panel-meta{border:0;padding-top:2px;font-size:10.5px;line-height:1.5;}
    .panel-play{padding:8px 12px;font-size:12px;}
    .panel-tools{display:none;}
    .lyrics-stage{flex:1;min-height:0;}
    .lyrics-line{font-size:19px;line-height:1.95;}
    .lyrics-line.current,.lyrics-line.upcoming{font-size:27px;}
    .transport{padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom));gap:8px;}
    .vol-row{display:none;}
    .play-btn{width:56px;height:56px;font-size:22px;}
    .skip-btn{width:44px;height:44px;font-size:15px;}
    .transport-btns{gap:10px;width:100%;justify-content:center;}
    .controls-row{justify-content:center;}
    .sync-foot{flex-wrap:wrap;}
    .sync-stage{height:190px;}
    .sync-track{padding:95px 16px;}
    .modal{padding:16px;}
  }
</style>

<div class="app">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px;">
      <button class="btn menu-btn" id="menuBtn" aria-label="曲リスト">☰</button>
      <span class="brand-mark">KNOX</span>
    </div>
    <div class="topbar-btns">
      <button class="btn" id="driveBtn">Drive</button>
      <button class="btn" id="backupBtn" title="全曲の歌詞と同期データを1ファイルに書き出す">バックアップ</button>
      <button class="btn" id="restoreBtn" title="バックアップから復元する">復元</button>
      <button class="btn btn-accent" id="openAddBtn">+ 追加</button>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>
  <div class="main-layout">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-scroll" id="sidebarScroll"></div>
      <div class="sidebar-footer">
        <button type="button" class="dropzone-hint" id="dropzoneHint">ファイルを選ぶ</button>
        <button type="button" class="dropzone-hint" id="folderHint" style="margin-top:6px;">フォルダごと取り込む<br><span style="font-size:10px;">フォルダ名がアルバムになります</span></button>
        <div style="margin-top:6px;text-align:center;color:var(--text-dim);font-size:10px;line-height:1.5;">歌詞ファイル（LRC/SRT/ASS/TXT）も<br>そのまま入れられます。LRCなら同期も不要</div>
        <div class="ver-label" id="verLabel"></div>
      </div>
    </div>

    <div class="main-content">
      <main class="stage" id="stage">
        <div class="stage-empty">
          <h2>曲がありません</h2>
          <p>左から選んでください</p>
        </div>
      </main>

      <div class="transport">
        <div class="seek-row">
          <span class="time-label" id="currentTime">0:00</span>
          <input type="range" min="0" max="100" value="0" id="seekBar">
          <span class="time-label end" id="duration">0:00</span>
        </div>
        <div class="controls-row">
          <div class="transport-btns">
            <button class="skip-btn" id="prevBtn">⏮</button>
            <button class="play-btn" id="playBtn">▶</button>
            <button class="skip-btn" id="nextBtn">⏭</button>
            <button class="skip-btn" id="stopBtn" title="停止（先頭に戻る）">⏹</button>
            <button class="skip-btn" id="shuffleBtn" title="ランダム再生">🔀</button>
            <button class="skip-btn" id="loopBtn">🔁</button>
          </div>
          <div class="vol-row">
            🔊 <input type="range" min="0" max="100" value="70" id="volumeSlider">
          </div>
          <button class="btn" id="syncBtn" style="display:none;">同期</button>
        </div>
      </div>
    </div>
  </div>
</div>

<audio id="player" preload="metadata"></audio>
<input type="file" id="fileInput" multiple style="display:none">
<input type="file" id="folderInput" webkitdirectory directory multiple style="display:none">
<input type="file" id="jsonInput" accept=".json,application/json" style="display:none">
<div class="drop-overlay" id="dropOverlay"><div class="drop-overlay-inner"><strong>DROP</strong></div></div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h2>曲を編集</h2>
    <form id="trackForm">
      <div class="field">
        <label for="f-title">曲名</label>
        <input type="text" id="f-title" required>
      </div>
      <div class="field">
        <label for="f-album">アルバム</label>
        <input type="text" id="f-album" list="albumOptions" placeholder="アルバム名（自由に入力できます）">
        <datalist id="albumOptions"></datalist>
      </div>
      <div class="field">
        <label for="f-cover">ジャケット</label>
        <input type="file" id="f-cover" accept="image/*">
      </div>
      <div class="field">
        <label for="f-lyrics">歌詞</label>
        <textarea id="f-lyrics" placeholder="1行ずつ歌詞を入力"></textarea>
        <div class="field-buttons">
          <button type="button" class="btn" id="clearLyricsBtn">クリア</button>
          <button type="button" class="btn" id="clearSyncBtn">同期データを消す</button>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" id="deleteBtn" style="margin-right:auto;">削除</button>
        <button type="button" class="btn" id="cancelBtn">キャンセル</button>
        <button type="submit" class="btn btn-accent">保存</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-backdrop" id="plBackdrop">
  <div class="modal">
    <h2>新しいプレイリスト</h2>
    <div class="field">
      <label for="f-plname">名前</label>
      <input type="text" id="f-plname" placeholder="ライブ用、お気に入り など">
    </div>
    <div class="modal-actions">
      <button type="button" class="btn" id="plCancelBtn">キャンセル</button>
      <button type="button" class="btn btn-accent" id="plCreateBtn">作成</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="pickBackdrop">
  <div class="modal">
    <h2>この音源をどの曲に入れますか？</h2>
    <div class="field">
      <label>追加したファイル</label>
      <div id="pickFileName" style="font-size:13px;color:var(--text);"></div>
    </div>
    <div class="field">
