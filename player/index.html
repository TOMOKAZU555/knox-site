<script>
// Google クライアントID（公開情報。端末ごとの入力を不要にするため埋め込み）
window.KNOX_CLIENT_ID = '196756138644-m0633ld7rlmfla8c7j7ddv02l6qb59s9.apps.googleusercontent.com';

var app = {
  VERSION: 'v40',
  db: null,
  state: {
    tracks: [],
    currentId: null,
    playingId: null,
    audioUrl: null,
    loopMode: 0,
    shuffle: false,
    playlists: [],
    activePlaylist: null,
    albumCovers: {},
    collapsed: {},
    sync: null,
    editingId: null,
    covers: {}
  },
  OTHER: 'その他',

  // 曲が実際に持っているアルバム名をそのまま集める。決め打ちの分類は無い
  albumList: function() {
    var self = this;
    var names = [];
    this.state.tracks.forEach(function(t) {
      var a = t.album || self.OTHER;
      if(names.indexOf(a) < 0) names.push(a);
    });
    names.sort(function(x, y) {
      if(x === self.OTHER) return 1;
      if(y === self.OTHER) return -1;
      return x.localeCompare(y, 'ja');
    });
    return names;
  },

  // ジャケットは曲ごと → 無ければアルバムの絵 → 無ければプレースホルダ
  // 以前こちらが勝手に付けていた分類は「その他」に寄せる
  normalizeAlbum: function(name) {
    if(!name) return this.OTHER;
    if(['Others', 'ARRANGEMENT', 'ORIGINALS', 'SINGLES'].indexOf(name) >= 0) return this.OTHER;
    return name;
  },

  // 「(after Bach)」や先頭の曲番号を無視して照合する
  matchKey: function(name) {
    return String(name || '')
      .replace(/\.(mp3|wav|m4a|aac|flac|ogg|opus|aiff?|mp4|wma|alac)$/i, '')
      .replace(/[（(]\s*after[^）)]*[）)]/ig, '')
      .replace(/\s*[-–—]\s*after\s[^-–—]*$/i, '')
      .replace(/^\s*(?:\d{2,}[\s._)\-\]]+|\d{1,2}[._)\-\]]+\s*)/, '')
      .replace(/[\s_]+/g, ' ')
      .trim().toLowerCase();
  },

  isLyricFile: function(name) { return /\.(lrc|srt|ass|ssa|vtt|txt)$/i.test(name); },

  // メモ帳で作った歌詞ファイル(Shift_JIS / BOM付き)でも文字化けしないように読む
  decodeText: function(buffer) {
    var bytes = new Uint8Array(buffer);
    var txt = null;
    try { txt = new TextDecoder('utf-8', {fatal: true}).decode(bytes); }
    catch(e) {
      var tryEnc = ['shift_jis', 'euc-jp', 'utf-16le'];
      for(var i = 0; i < tryEnc.length && txt === null; i++) {
        try { txt = new TextDecoder(tryEnc[i], {fatal: true}).decode(bytes); } catch(e2) {}
      }
      if(txt === null) txt = new TextDecoder('utf-8').decode(bytes);
    }
    return txt.replace(/^﻿/, '');
  },

  readLyricBlob: function(blob, cb) {
    var self = this;
    var r = new FileReader();
    r.onload = function(e) { cb(self.decodeText(e.target.result)); };
    r.onerror = function() { cb(null); };
    r.readAsArrayBuffer(blob);
  },

  // 歌詞ファイルを読む。時間情報があれば同期データも作る
  parseLyricFile: function(name, text) {
    var lines = String(text).replace(/\r/g, '').split('\n');
    var out = [], times = [];
    var toSec = function(h, m, sec, frac, fracLen) {
      return (+h||0)*3600 + (+m||0)*60 + (+sec||0) + (frac ? (+frac)/Math.pow(10, fracLen) : 0);
    };
    var ext = (name.match(/\.([a-z0-9]+)$/i) || [,''])[1].toLowerCase();

    if(ext === 'lrc') {
      lines.forEach(function(l) {
        var m = l.match(/^\s*\[(\d{1,2}):(\d{2})(?:[.:](\d{1,3}))?\]\s*(.*)$/);
        if(!m) return;
        var body = m[4].trim();
        if(!body) return;
        times.push(toSec(0, m[1], m[2], m[3], (m[3]||'').length));
        out.push(body);
      });
    } else if(ext === 'srt' || ext === 'vtt') {
      for(var i = 0; i < lines.length; i++) {
        var m2 = lines[i].match(/(\d{1,2}):(\d{2}):(\d{2})[.,](\d{1,3})\s*-->/);
        if(!m2) continue;
        var t = toSec(m2[1], m2[2], m2[3], m2[4], m2[4].length);
        var body2 = [];
        for(var j = i + 1; j < lines.length && lines[j].trim(); j++) {
          body2.push(lines[j].replace(/<[^>]*>/g, '').trim());
        }
        if(body2.length) { times.push(t); out.push(body2.join(' ')); }
        i = j;
      }
    } else if(ext === 'ass' || ext === 'ssa') {
      lines.forEach(function(l) {
        var m3 = l.match(/^Dialogue:\s*[^,]*,\s*(\d{1,2}):(\d{2}):(\d{2})[.:](\d{1,2})\s*,/);
        if(!m3) return;
        var body3 = l.split(',').slice(9).join(',')
          .replace(/\{[^}]*\}/g, '').replace(/\\[Nnh]/g, ' ').trim();
        if(!body3) return;
        times.push(toSec(m3[1], m3[2], m3[3], m3[4], m3[4].length));
        out.push(body3);
      });
    } else {
      lines.forEach(function(l) { if(l.trim()) out.push(l.trim()); });
    }

    if(!out.length) return null;
    // 時間順に整える
    if(times.length === out.length) {
      var pair = out.map(function(v, i) { return [times[i], v]; });
      pair.sort(function(a, b) { return a[0] - b[0]; });
      out = pair.map(function(x) { return x[1]; });
      times = pair.map(function(x) { return x[0]; });
    } else { times = []; }
    return {lyrics: out.join('\n'), syncData: times};
  },

  lyricBase: function(fileName) {
    return String(fileName || '').replace(/\.(lrc|srt|ass|ssa|vtt|txt)$/i, '')
      .replace(/[\s_]*[（(\[]?\s*(歌詞|lyrics?|sync|同期)\s*[）)\]]?\s*$/i, '');
  },

  // 歌詞ファイル1つを、曲名が合う曲へ入れる。戻り値は入れられたかどうか
  applyLyricFile: function(fileName, text, done) {
    var base = this.lyricBase(fileName);
    var track = this.findTrackByName(base, false);
    if(!track) { this.showToast('曲が見つかりません: ' + fileName); if(done) done(false); return false; }
    var parsed = this.parseLyricFile(fileName, text);
    if(!parsed) { this.showToast('歌詞を読めませんでした: ' + fileName); if(done) done(false); return false; }
    var count = parsed.lyrics.split('\n').length;
    track.lyrics = parsed.lyrics;
    if(parsed.syncData.length) track.syncData = parsed.syncData;
    this.saveData();
    this.render();
    this.showToast(track.title + ' に歌詞' + count + '行を入れました'
      + (parsed.syncData.length ? '（タイミング付き・同期不要）' : ''));
    if(done) done(true);
    return true;
  },

  findTrackByName: function(name, onlyWithoutAudio) {
    var key = this.matchKey(name);
    if(!key) return null;
    return this.state.tracks.find(function(t) {
      if(onlyWithoutAudio && t.hasAudio !== false) return false;
      return app.matchKey(t.title) === key;
    }) || null;
  },

  coverOf: function(track) {
    return this.state.covers[track.id] || this.state.albumCovers[track.album || this.OTHER] || null;
  },

  saveAlbumCovers: function() {
    if(!this.db) return;
    this.db.transaction('tracks', 'readwrite').objectStore('tracks')
      .put({id: '__albumcovers__', albumCovers: this.state.albumCovers});
  },

  init: function() {
    var self = this;
    var dbReq = indexedDB.open('KnoxDB', 1);

    dbReq.onupgradeneeded = function(e) {
      var db = e.target.result;
      if(!db.objectStoreNames.contains('tracks')) {
        db.createObjectStore('tracks', {keyPath: 'id'});
      }
    };

    dbReq.onsuccess = function(e) {
      self.db = e.target.result;
      self.loadData(function() {
        self.setupListeners();
        self.render();
      });
    };

    dbReq.onerror = function() {
      alert('データベース初期化エラー');
    };
  },

  setupListeners: function() {
    var self = this;

    document.getElementById('openAddBtn').addEventListener('click', function() {
      document.getElementById('fileInput').click();
    });

    document.getElementById('fileInput').addEventListener('change', function() {
      self.handleFiles(this.files);
      this.value = '';
    });

    document.getElementById('folderHint').addEventListener('click', function() {
      document.getElementById('folderInput').click();
    });

    document.getElementById('folderInput').addEventListener('change', function() {
      self.handleFolder(this.files);
      this.value = '';
    });

    document.getElementById('dropzoneHint').addEventListener('click', function() {
      document.getElementById('fileInput').click();
    });

    document.addEventListener('dragenter', function(e) {
      if(e.dataTransfer.items) {
        for(var i = 0; i < e.dataTransfer.items.length; i++) {
          if(e.dataTransfer.items[i].kind === 'file') {
            document.getElementById('dropOverlay').classList.add('active');
            break;
          }
        }
      }
    });

    document.addEventListener('dragover', function(e) { e.preventDefault(); });
    document.addEventListener('dragleave', function() {
      document.getElementById('dropOverlay').classList.remove('active');
    });

    document.addEventListener('drop', function(e) {
      e.preventDefault();
      document.getElementById('dropOverlay').classList.remove('active');
      if(self.dragTrackId) return;              // 曲の移動中はファイル処理しない
      if(e.dataTransfer.files && e.dataTransfer.files.length) self.handleFiles(e.dataTransfer.files);
    });

    document.getElementById('playBtn').addEventListener('click', function() {
      if(!self.state.playingId) { if(self.state.currentId) self.playTrack(self.state.currentId); return; }
      var audio = document.getElementById('player');
      if(audio.paused) audio.play().catch(function(){});
      else audio.pause();
    });

    document.getElementById('prevBtn').addEventListener('click', function() {
      var audio = document.getElementById('player');
      // 3秒以上流れていたら、まず頭出し
      if(self.state.playingId && audio.currentTime > 3) { audio.currentTime = 0; return; }
      var t = self.neighborTrack(-1);
      if(t) self.playTrack(t.id);
    });

    document.getElementById('nextBtn').addEventListener('click', function() {
      var t = self.neighborTrack(1);
      if(t) self.playTrack(t.id);
    });

    document.getElementById('stopBtn').addEventListener('click', function() {
      var audio = document.getElementById('player');
      audio.pause();
      audio.currentTime = 0;
      self.updateLyricsHighlight();
    });

    document.getElementById('shuffleBtn').addEventListener('click', function() {
      self.state.shuffle = !self.state.shuffle;
      this.style.color = self.state.shuffle ? 'var(--accent)' : 'var(--text)';
      this.style.borderColor = self.state.shuffle ? 'var(--accent)' : 'var(--border)';
      self.showToast(self.state.shuffle ? 'ランダム再生: オン' : 'ランダム再生: オフ');
    });

    document.getElementById('plCancelBtn').addEventListener('click', function() {
      document.getElementById('plBackdrop').classList.remove('open');
    });
    document.getElementById('plCreateBtn').addEventListener('click', function() {
      var name = document.getElementById('f-plname').value.trim();
      if(!name) { alert('名前を入れてください'); return; }
      var id = 'pl_' + Date.now().toString(36);
      self.state.playlists.push({id: id, name: name, trackIds: []});
      self.state.activePlaylist = id;
      self.savePlaylists();
      document.getElementById('plBackdrop').classList.remove('open');
      self.render();
      self.showToast('「' + name + '」を作りました。曲の右の＋で追加できます');
    });

    document.getElementById('loopBtn').addEventListener('click', function() {
      self.state.loopMode = (self.state.loopMode + 1) % 3;
      this.style.color = self.state.loopMode > 0 ? 'var(--accent)' : 'var(--text)';
    });

    document.getElementById('volumeSlider').addEventListener('change', function() {
      document.getElementById('player').volume = this.value / 100;
    });

    var audio = document.getElementById('player');
    audio.addEventListener('timeupdate', function() {
      document.getElementById('currentTime').textContent = self.fmtTime(this.currentTime);
      if(!audio.seeking) document.getElementById('seekBar').value = (this.currentTime / this.duration) * 100 || 0;
      self.updateLyricsHighlight();
    });

    audio.addEventListener('loadedmetadata', function() {
      document.getElementById('duration').textContent = self.fmtTime(this.duration);
    });

    audio.addEventListener('play', function() {
      document.getElementById('playBtn').textContent = '⏸';
    });

    audio.addEventListener('pause', function() {
      document.getElementById('playBtn').textContent = '▶';
    });

    audio.addEventListener('ended', function() {
      if(self.state.loopMode === 2) {
        audio.currentTime = 0;
        audio.play().catch(function(){});
        return;
      }
      if(self.state.loopMode === 1 || self.state.shuffle) {
        var t = self.neighborTrack(1);
        if(t) self.playTrack(t.id);
      }
    });

    document.getElementById('seekBar').addEventListener('change', function() {
      audio.currentTime = (this.value / 100) * audio.duration;
    });

    document.getElementById('menuBtn').addEventListener('click', function() { self.toggleMenu(true); });
    document.getElementById('scrim').addEventListener('click', function() { self.toggleMenu(false); });

    document.getElementById('driveBtn').addEventListener('click', function() { self.openDrive(); });
    document.getElementById('driveCloseBtn').addEventListener('click', function() {
      document.getElementById('driveBackdrop').classList.remove('open');
    });
    document.getElementById('saveClientIdBtn').addEventListener('click', function() {
      var v = document.getElementById('f-clientid').value.trim();
      if(!v) { alert('クライアントIDを入れてください'); return; }
      self.drive.setClientId(v);
      self.drive.tokenClient = null;
      self.openDrive();
      self.showToast('クライアントIDを保存しました');
    });
    document.getElementById('driveSignInBtn').addEventListener('click', function() { self.driveSignIn(); });
    document.getElementById('driveUpBtn').addEventListener('click', function() { self.driveUpload(); });
    document.getElementById('driveDownBtn').addEventListener('click', function() { self.driveDownload(); });

    document.getElementById('backupBtn').addEventListener('click', function() {
      self.exportLibrary();
    });

    document.getElementById('restoreBtn').addEventListener('click', function() {
      document.getElementById('jsonInput').click();
    });

    document.getElementById('jsonInput').addEventListener('change', function() {
      var file = this.files && this.files[0];
      this.value = '';
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(e) {
        var data;
        try { data = JSON.parse(e.target.result); }
        catch(err) { alert('JSONを読めませんでした'); return; }
        if(data && Array.isArray(data.tracks)) self.restoreLibrary(data);
        else self.importOneTrack(data);
      };
      reader.readAsText(file);
    });

    document.getElementById('syncBtn').addEventListener('click', function() {
      self.startSync();
    });

    document.getElementById('syncTapBtn').addEventListener('click', function() {
      if(!self.state.sync) return;
      var currentTime = document.getElementById('player').currentTime;

      // 画面に出ている行の絶対時刻をそのまま記録
      self.state.sync.marks.push(currentTime);
      self.state.sync.log.push('line');
      self.state.sync.index++;
      self.updateSyncUI();
    });

    document.getElementById('syncInterludeBtn').addEventListener('click', function() {
      if(!self.state.sync) return;
      if(self.state.sync.index === 0) { self.showToast('先に1行目をタップしてください'); return; }
      self.state.sync.interludes.push(document.getElementById('player').currentTime);
      self.state.sync.log.push('interlude');
      self.updateSyncUI();
    });

    document.getElementById('syncUndoBtn').addEventListener('click', function() {
      var s = self.state.sync;
      if(!s || !s.log.length) return;
      var last = s.log.pop();
      var t = null;
      if(last === 'line') { t = s.marks.pop(); s.index--; }
      else if(last === 'interlude') { t = s.interludes.pop(); }
      // 曲も戻す。押した3秒前から聴き直せるので、やり直しにならない
      self.seekSync(t == null ? 0 : t - 3);
      self.updateSyncUI();
    });

    document.getElementById('syncSkipBtn').addEventListener('click', function() {
      var s = self.state.sync;
      if(!s) return;
      if(s.index >= s.lines.length) return;
      var prev = s.base[s.index];
      if(prev == null) { self.showToast('この先は記録がないのでスキップできません'); return; }
      // 前回記録した時刻をそのまま採用して次の行へ
      s.marks.push(prev);
      s.log.push('line');
      s.index++;
      var nextT = s.base[s.index];
      self.seekSync(nextT == null ? prev : nextT - 3);
      self.updateSyncUI();
    });

    document.getElementById('syncRestartBtn').addEventListener('click', function() {
      if(!self.state.sync) return;
      self.state.sync.index = 0;
      self.state.sync.marks = [];
      self.state.sync.interludes = [];
      self.state.sync.log = [];
      self.seekSync(0);
      self.updateSyncUI();
    });

    document.getElementById('syncCloseBtn').addEventListener('click', function() {
      // 途中でも保存する。やめても叩いた分は消えない
      var s = self.state.sync;
      if(s && s.marks.length) {
        var track = self.state.tracks.find(function(t) { return t.id === self.state.currentId; });
        if(track) {
          track.syncData = s.marks.slice();
          track.interludes = s.interludes.slice().sort(function(a, b) { return a - b; });
          self.saveData();
          self.showToast(s.marks.length >= s.lines.length
            ? '同期を保存しました（全' + s.lines.length + '行）'
            : s.marks.length + ' / ' + s.lines.length + '行を保存しました。次回は続きから再開します');
        }
      }
      self.state.sync = null;
      document.getElementById('syncOverlay').classList.remove('open');
      document.getElementById('syncTapBtn').style.display = 'flex';
      document.getElementById('syncUndoBtn').style.display = 'block';
      document.getElementById('syncRestartBtn').style.display = 'block';
      document.getElementById('player').pause();
    });

    document.getElementById('trackForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var track = self.state.tracks.find(function(t) { return t.id === self.state.editingId; });
      if(!track) return;
      track.title = document.getElementById('f-title').value;
      track.album = document.getElementById('f-album').value;
      track.lyrics = document.getElementById('f-lyrics').value;

      var coverInput = document.getElementById('f-cover');
      if(coverInput.files && coverInput.files[0]) {
        var reader = new FileReader();
        reader.onload = function(e) {
          self.state.covers[track.id] = e.target.result;
          self.saveData();
          self.render();
          document.getElementById('modalBackdrop').classList.remove('open');
          self.showToast('保存しました');
        };
        reader.readAsDataURL(coverInput.files[0]);
      } else {
        self.saveData();
        self.render();
        document.getElementById('modalBackdrop').classList.remove('open');
        self.showToast('保存しました');
      }
    });

    document.getElementById('deleteBtn').addEventListener('click', function() {
      if(!confirm('削除しますか？')) return;
      var trackId = self.state.editingId;
      self.state.tracks = self.state.tracks.filter(function(t) { return t.id !== trackId; });
      delete self.state.covers[trackId];
      if(self.state.playingId === trackId) {
        document.getElementById('player').pause();
        document.getElementById('player').removeAttribute('src');
        self.state.playingId = null;
      }
      if(self.state.currentId === trackId) self.state.currentId = self.state.tracks.length ? self.state.tracks[0].id : null;

      var tx = self.db.transaction('tracks', 'readwrite');
      tx.objectStore('tracks').delete(trackId);

      self.render();
      document.getElementById('modalBackdrop').classList.remove('open');
      self.showToast('削除しました');
    });

    document.getElementById('cancelBtn').addEventListener('click', function() {
      document.getElementById('modalBackdrop').classList.remove('open');
    });

    document.getElementById('clearLyricsBtn').addEventListener('click', function() {
      if(!confirm('歌詞をクリアしますか？')) return;
      document.getElementById('f-lyrics').value = '';
    });

    document.getElementById('clearSyncBtn').addEventListener('click', function() {
      var track = self.state.tracks.find(function(t) { return t.id === self.state.editingId; });
      if(!track) return;
      if(!confirm('この曲の同期データを消しますか？')) return;
      track.syncData = null;
      track.interludes = [];
      self.saveData();
      self.updateLyricsHighlight();
      self.showToast('同期データを消しました');
    });

    document.getElementById('verLabel').textContent = 'KNOX PLAYER ' + this.VERSION;
    document.getElementById('player').volume = 0.7;
  },

  // いま再生の対象になっている曲の並び
  playQueue: function() {
    var self = this;
    if(!this.state.activePlaylist) return this.state.tracks.slice();
    var pl = this.state.playlists.find(function(p) { return p.id === self.state.activePlaylist; });
    if(!pl) return this.state.tracks.slice();
    return pl.trackIds.map(function(id) {
      return self.state.tracks.find(function(t) { return t.id === id; });
    }).filter(Boolean);
  },

  // 次に再生する曲。シャッフル中はランダムに選ぶ
  neighborTrack: function(dir) {
    var q = this.playQueue();
    if(!q.length) return null;
    if(this.state.shuffle) {
      if(q.length === 1) return q[0];
      var cur = this.state.playingId, pick;
      do { pick = q[Math.floor(Math.random() * q.length)]; } while(pick.id === cur);
      return pick;
    }
    var self = this;
    var idx = q.findIndex(function(t) { return t.id === self.state.playingId; });
    if(idx < 0) return q[0];
    var n = idx + dir;
    if(n < 0) n = q.length - 1;
    if(n >= q.length) n = 0;
    return q[n];
  },

  dragTrackId: null,

  onTrackDragStart: function(ev, id) {
    this.dragTrackId = id;
    try { ev.dataTransfer.setData('text/plain', id); ev.dataTransfer.effectAllowed = 'move'; } catch(e) {}
    document.body.classList.add('dragging-track');
  },

  onTrackDragEnd: function() {
    this.dragTrackId = null;
    document.body.classList.remove('dragging-track');
    var els = document.querySelectorAll('.drop-target');
    for(var i = 0; i < els.length; i++) els[i].classList.remove('drop-target');
  },

  onDropOver: function(ev, el) {
    if(!this.dragTrackId) return;
    ev.preventDefault();
    ev.stopPropagation();
    if(el) el.classList.add('drop-target');
  },

  onDropLeave: function(el) { if(el) el.classList.remove('drop-target'); },

  // アルバム見出しに落とす → そのアルバムへ移動
  dropOnAlbum: function(ev, album) {
    ev.preventDefault();
    ev.stopPropagation();
    var id = this.dragTrackId;
    this.onTrackDragEnd();
    if(!id) return;
    var track = this.state.tracks.find(function(t) { return t.id === id; });
    if(!track || track.album === album) return;
    track.album = album;
    this.saveData();
    this.render();
    this.showToast('「' + track.title + '」を ' + album + ' に移しました');
  },

  // プレイリストに落とす → そこへ追加
  dropOnPlaylist: function(ev, plId) {
    ev.preventDefault();
    ev.stopPropagation();
    var id = this.dragTrackId;
    this.onTrackDragEnd();
    if(!id) return;
    var pl = this.state.playlists.find(function(p) { return p.id === plId; });
    var track = this.state.tracks.find(function(t) { return t.id === id; });
    if(!pl || !track) return;
    if(pl.trackIds.indexOf(id) < 0) pl.trackIds.push(id);
    this.savePlaylists();
    this.render();
    this.showToast('「' + track.title + '」を ' + pl.name + ' に追加しました');
  },

  togglePlaylist: function(id) {
    this.state.activePlaylist = (this.state.activePlaylist === id) ? null : id;
    this.render();
  },

  newPlaylist: function() {
    document.getElementById('f-plname').value = '';
    document.getElementById('plBackdrop').classList.add('open');
    setTimeout(function() { document.getElementById('f-plname').focus(); }, 50);
  },

  deletePlaylist: function(id) {
    var self = this;
    var pl = this.state.playlists.find(function(p) { return p.id === id; });
    if(!pl) return;
    if(!confirm('プレイリスト「' + pl.name + '」を削除しますか？（曲自体は消えません）')) return;
    this.state.playlists = this.state.playlists.filter(function(p) { return p.id !== id; });
    if(this.state.activePlaylist === id) this.state.activePlaylist = null;
    this.savePlaylists();
    this.render();
  },

  // プレイリストへの出し入れ
  toggleInPlaylist: function(trackId) {
    var self = this;
    var pl = this.state.playlists.find(function(p) { return p.id === self.state.activePlaylist; });
    if(!pl) return;
    var i = pl.trackIds.indexOf(trackId);
    if(i >= 0) pl.trackIds.splice(i, 1); else pl.trackIds.push(trackId);
    this.savePlaylists();
    this.render();
  },

  savePlaylists: function() {
    if(!this.db) return;
    var store = this.db.transaction('tracks', 'readwrite').objectStore('tracks');
    store.put({id: '__playlists__', playlists: this.state.playlists});
  },

  toggleMenu: function(open) {
    document.getElementById('sidebar').classList.toggle('open', open);
    document.getElementById('scrim').classList.toggle('open', open);
  },

  // スマホのロック画面から操作できるようにする
  setupMediaSession: function(track) {
    if(!('mediaSession' in navigator)) return;
    var audio = document.getElementById('player');
    var art = this.state.covers[track.id];
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: track.title, artist: 'KNOX', album: track.album || '',
        artwork: art ? [{src: art, sizes: '512x512', type: 'image/png'}] : []
      });
    } catch(e) {}
    var set = function(action, fn) { try { navigator.mediaSession.setActionHandler(action, fn); } catch(e) {} };
    set('play', function() { audio.play().catch(function(){}); });
    set('pause', function() { audio.pause(); });
    set('previoustrack', function() { document.getElementById('prevBtn').click(); });
    set('nexttrack', function() { document.getElementById('nextBtn').click(); });
    set('seekbackward', function() { audio.currentTime = Math.max(0, audio.currentTime - 10); });
    set('seekforward', function() { audio.currentTime = audio.currentTime + 10; });
  },

  // 左のリストで選ぶだけ。再生中の曲は止めない
  selectTrack: function(id) {
    var self = this;
    if(!this.state.tracks.some(function(t) { return t.id === id; })) return;
    this.state.currentId = id;
    this.toggleMenu(false);
    this.render();
    setTimeout(function() { self.updateLyricsHighlight(); }, 50);
  },

  // 実際に音を切り替えるのはここだけ
  playTrack: function(id, callback) {
    var self = this;
    var track = this.state.tracks.find(function(t) { return t.id === id; });
    if(!track) return;
    this.state.currentId = id;

    var tx = this.db.transaction('tracks', 'readonly');
    var req = tx.objectStore('tracks').get(id);

    var start = function(blob) {
      if(self.state.audioUrl) URL.revokeObjectURL(self.state.audioUrl);
      self.state.audioUrl = URL.createObjectURL(blob);
      self.state.playingId = id;
      var audio = document.getElementById('player');
      audio.src = self.state.audioUrl;
      self.render();
      setTimeout(function() { self.updateLyricsHighlight(); }, 50);
      audio.onerror = function() {
        self.showToast('この形式は再生できません: ' + track.title + '（ブラウザが対応していない可能性があります）');
      };
      audio.play().catch(function(){});
      self.setupMediaSession(track);
      self.toggleMenu(false);
      if(callback) callback();
    };

    req.onsuccess = function() {
      var data = req.result;
      if(data && data.audio) { start(data.audio); return; }
      // 端末に音源が無くても、Driveにあれば取ってきて再生する
      if(track.driveAudioId) {
        self.fetchAudioFromDrive(track, start, function(m) { self.showToast('音源を取得できません: ' + m); });
        return;
      }
      self.showToast('音源がありません。mp3を追加してください');
    };
  },

  handleFiles: function(files) {
    var self = this;
    var all = Array.from(files);
    // 明らかに音源でないものだけ除く。それ以外は形式を問わず受け付ける
    var self0 = this;
    var lyricFiles = all.filter(function(f) { return self0.isLyricFile(f.name); });
    all = all.filter(function(f) { return lyricFiles.indexOf(f) < 0; });
    lyricFiles.forEach(function(f) {
      self0.readLyricBlob(f, function(text) {
        if(text === null) { self0.showToast('読めませんでした: ' + f.name); return; }
        self0.applyLyricFile(f.name, text);
      });
    });
    var skipped = all.filter(function(f) {
      return /\.(json|md|html|htm|css|js|csv|zip|pdf|docx?|xlsx?)$/i.test(f.name)
          || (f.type && (f.type.indexOf('image/') === 0));
    });
    var list = all.filter(function(f) { return skipped.indexOf(f) < 0; });
    if(skipped.length) {
      this.showToast('音源として読めないファイルを除きました: ' + skipped.map(function(f){return f.name;}).join('、'));
    }
    if(!list.length) {
      if(lyricFiles.length) return;
      if(all.length) alert('音源ファイルが見つかりませんでした。\n選んだファイル: ' + all.map(function(f){return f.name;}).join('、'));
      return;
    }
    var i = 0;
    var next = function() {
      if(i >= list.length) return;
      var file = list[i++];
      var reader = new FileReader();
      reader.onload = function(e) {
        var base = file.name.replace(/\.[^.]+$/, '');
        var blob = new Blob([e.target.result], {type: file.type || 'audio/mpeg'});
        // 1) 曲名がぴたり一致する「音源なし」の曲があればそこへ
        var orphan = self.findTrackByName(base, true);
        if(orphan) { self.attachAudio(orphan, blob, '音源をひも付けました: ' + orphan.title, next); return; }
        // 2) 一致しないが音源待ちの曲があるなら、どれに入れるか選んでもらう
        var waiting = self.state.tracks.filter(function(t) { return t.hasAudio === false; });
        if(waiting.length) {
          self.askTrackForAudio(file.name, waiting, function(track) {
            if(track) self.attachAudio(track, blob, '音源をひも付けました: ' + track.title, next);
            else self.attachAudio(self.newTrack(base), blob, '追加しました: ' + base, next);
          });
          return;
        }
        // 3) 待っている曲が無ければ新しい曲として追加
        self.attachAudio(self.newTrack(base), blob, '追加しました: ' + base, next);
      };
      reader.readAsArrayBuffer(file);
    };
    next();
  },

  // フォルダ名をアルバム名にして丸ごと取り込む。画像はアルバムのジャケットにする
  handleFolder: function(fileList) {
    var self = this;
    var files = Array.from(fileList);
    if(!files.length) return;
    var groups = {};
    files.forEach(function(f) {
      var rel = f.webkitRelativePath || f.name;
      var parts = rel.split('/');
      // 一番深いフォルダ名をアルバム名にする（ルート直下ならそのフォルダ名）
      var album = parts.length >= 2 ? parts[parts.length - 2] : self.OTHER;
      (groups[album] = groups[album] || []).push(f);
    });

    var albums = Object.keys(groups);
    var ai = 0;
    var nextAlbum = function() {
      if(ai >= albums.length) {
        self.saveData(); self.render();
        self.showToast('取り込みました: ' + albums.join('、'));
        return;
      }
      var album = albums[ai++];
      var list = groups[album];
      var image = list.find(function(f) { return /\.(jpg|jpeg|png|webp|gif)$/i.test(f.name) || (f.type && f.type.indexOf('image/') === 0); });
      var audios = list.filter(function(f) {
        return f !== image && !/\.(json|txt|lrc|md|html?|css|js|csv|zip|pdf|docx?|xlsx?|ini|db)$/i.test(f.name)
               && !(f.type && f.type.indexOf('image/') === 0);
      });

      var afterCover = function() {
        var i = 0;
        var nextFile = function() {
          if(i >= audios.length) { nextAlbum(); return; }
          var file = audios[i++];
          var reader = new FileReader();
          reader.onload = function(e) {
            var base = file.name.replace(/\.[^.]+$/, '');
            var blob = new Blob([e.target.result], {type: file.type || 'audio/mpeg'});
            var exist = self.findTrackByName(base, false);
            var track;
            if(exist) { track = exist; track.album = album; }
            else {
              track = {id: self.genId(), title: base, album: album, lyrics: '',
                       syncData: null, interludes: [], hasAudio: true, driveAudioId: null};
              self.state.tracks.push(track);
            }
            self.attachAudio(track, blob, '取り込み: ' + album + ' / ' + base, nextFile);
          };
          reader.readAsArrayBuffer(file);
        };
        nextFile();
      };

      if(image) {
        var ir = new FileReader();
        ir.onload = function(ev) { self.state.albumCovers[album] = ev.target.result; self.saveAlbumCovers(); afterCover(); };
        ir.readAsDataURL(image);
      } else { afterCover(); }
    };
    nextAlbum();
  },

  newTrack: function(title) {
    var track = {id: this.genId(), title: title, album: this.OTHER, lyrics: '',
                 syncData: null, interludes: [], hasAudio: true, driveAudioId: null};
    this.state.tracks.push(track);
    return track;
  },

  attachAudio: function(track, blob, message, done) {
    var self = this;
    track.hasAudio = true;
    track.driveAudioId = null;   // 差し替えたらDrive側も上げ直す
    var store = this.db.transaction('tracks', 'readwrite').objectStore('tracks');
    var getReq = store.get(track.id);
    getReq.onsuccess = function() {
      var rec = getReq.result || {id: track.id};
      rec.audio = blob;
      rec.title = track.title; rec.album = track.album; rec.lyrics = track.lyrics;
      rec.syncData = track.syncData; rec.interludes = track.interludes || [];
      rec.driveAudioId = null;
      if(self.state.covers[track.id]) rec.cover = self.state.covers[track.id];
      store.put(rec).onsuccess = function() {
        self.render();
        self.showToast(message);
        if(done) done();
      };
    };
  },

  askTrackForAudio: function(fileName, candidates, cb) {
    var self = this;
    document.getElementById('pickFileName').textContent = fileName;
    var list = document.getElementById('pickList');
    list.innerHTML = '';
    candidates.forEach(function(track) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn';
      b.style.justifyContent = 'flex-start';
      b.textContent = track.title + '（歌詞 ' + ((track.lyrics || '').split('\n').filter(function(l){return l.trim();}).length) + '行）';
      b.addEventListener('click', function() { close(); cb(track); });
      list.appendChild(b);
    });
    var newBtn = document.getElementById('pickNewBtn');
    var onNew = function() { close(); cb(null); };
    var close = function() {
      document.getElementById('pickBackdrop').classList.remove('open');
      newBtn.removeEventListener('click', onNew);
    };
    newBtn.addEventListener('click', onNew);
    document.getElementById('pickBackdrop').classList.add('open');
  },


  render: function() {
    var self = this;
    var active = this.state.activePlaylist
      ? this.state.playlists.find(function(p) { return p.id === self.state.activePlaylist; })
      : null;

    var sidebarHtml = '<div class="album-group"><div class="album-header" style="cursor:default;">';
    sidebarHtml += '<span class="album-title">プレイリスト</span>';
    sidebarHtml += '<span class="pl-add" onclick="app.newPlaylist()" title="新しいプレイリスト">＋</span>';
    sidebarHtml += '</div><div class="tracks-in-album open">';
    if(!this.state.playlists.length) {
      sidebarHtml += '<div class="pl-empty">＋ で作成できます</div>';
    }
    this.state.playlists.forEach(function(pl) {
      sidebarHtml += '<div class="track-item' + (self.state.activePlaylist === pl.id ? ' active' : '') + '" onclick="app.togglePlaylist(\'' + pl.id + '\')"'
        + ' ondragover="app.onDropOver(event,this)" ondragleave="app.onDropLeave(this)" ondrop="app.dropOnPlaylist(event,\'' + pl.id + '\')">';
      sidebarHtml += '<span class="track-name">' + pl.name + ' (' + pl.trackIds.length + ')</span>';
      sidebarHtml += '<span class="track-edit" onclick="event.stopPropagation(); app.deletePlaylist(\'' + pl.id + '\')">✕</span>';
      sidebarHtml += '</div>';
    });
    sidebarHtml += '</div></div>';
    if(active) {
      sidebarHtml += '<div class="pl-note">「' + active.name + '」を編集中<br>曲の右の ＋ で追加、✓ で外せます<br>再生と曲送りはこの中だけになります</div>';
    }

    this.albumList().forEach(function(album) {
      var tracks = self.state.tracks.filter(function(t) { return (t.album || self.OTHER) === album; });
      sidebarHtml += '<div class="album-group"><div class="album-header" onclick="app.toggleAlbum(\'' + album + '\')"'
        + ' ondragover="app.onDropOver(event,this)" ondragleave="app.onDropLeave(this)" ondrop="app.dropOnAlbum(event,' + JSON.stringify(album).replace(/"/g, '&quot;') + ')">';
      var open = !self.state.collapsed[album];
      sidebarHtml += '<span class="album-toggle' + (open ? ' open' : '') + '">▶</span>';
      sidebarHtml += '<span class="album-title">' + album + '</span>';
      sidebarHtml += '<span>(' + tracks.length + ')</span>';
      sidebarHtml += '</div><div class="tracks-in-album' + (open ? ' open' : '') + '">';
      tracks.forEach(function(track) {
        sidebarHtml += '<div class="track-item' + (self.state.currentId === track.id ? ' active' : '') + '" draggable="true"'
          + ' ondragstart="app.onTrackDragStart(event,\'' + track.id + '\')" ondragend="app.onTrackDragEnd()"'
          + ' onclick="app.selectTrack(\'' + track.id + '\')" ondblclick="app.playTrack(\'' + track.id + '\')">';
        sidebarHtml += '<span class="track-name">' + (self.state.playingId === track.id ? '♪ ' : '') + track.title + '</span>';
        if(active) {
          var inPl = active.trackIds.indexOf(track.id) >= 0;
          sidebarHtml += '<span class="track-edit" style="opacity:1;color:' + (inPl ? 'var(--accent-ink)' : 'var(--text-dim)') + ';" onclick="event.stopPropagation(); app.toggleInPlaylist(\'' + track.id + '\')">' + (inPl ? '✓' : '＋') + '</span>';
        } else {
          sidebarHtml += '<span class="track-edit" onclick="event.stopPropagation(); app.editTrack(\'' + track.id + '\')">✎</span>';
        }
        sidebarHtml += '</div>';
      });
      sidebarHtml += '</div></div>';
    });
    document.getElementById('sidebarScroll').innerHTML = sidebarHtml;

    var track = this.state.tracks.find(function(t) { return t.id === self.state.currentId; });
    var stageHtml = '';
    if(!track) {
      stageHtml = '<div class="stage-empty"><h2>曲がありません</h2><p>左から選んでください</p></div>';
    } else {
      var lines = (track.lyrics || '').split('\n').filter(function(l) { return l.trim(); });
      var cover = this.coverOf(track);
      var isPlaying = this.state.playingId === track.id;

      stageHtml = '<div class="now-panel">';
      stageHtml += '<div class="panel-cover"' + (cover ? ' style="background-image:url(' + cover + ')"' : '') + '>' + (cover ? '' : '<span>♪</span>') + '</div>';
      stageHtml += '<div class="panel-info">';
      stageHtml += isPlaying
        ? '<div class="panel-badge"><span class="dot"></span>NOW PLAYING</div>'
        : '<div class="panel-badge idle"><span class="dot"></span>SELECTED</div>';
      stageHtml += '<div class="panel-title">' + track.title + '</div>';
      stageHtml += '<div class="panel-album">' + (track.album || '') + '</div>';
      if(!isPlaying) {
        stageHtml += '<button class="btn btn-accent panel-play" id="panelPlayBtn">▶ この曲を再生</button>';
      }
      stageHtml += '<div class="panel-meta">歌詞 ' + lines.length + '行';
      if(track.syncData && track.syncData.length) {
        stageHtml += '<br>同期済み ' + track.syncData.length + ' / ' + lines.length + '行';
        if(track.interludes && track.interludes.length) stageHtml += '<br>間奏 ' + track.interludes.length + '箇所';
      } else {
        stageHtml += '<br>同期なし';
      }
      if(track.hasAudio === false) stageHtml += '<br><span style="color:var(--accent)">音源なし — mp3を追加してください</span>';
      stageHtml += '</div><div class="panel-tools">';
      if(track.syncData && track.syncData.length) {
        stageHtml += '<button class="btn" id="shiftFwdBtn" title="赤字が曲より1行遅れている時に押す">1行 進める</button>';
        stageHtml += '<button class="btn" id="shiftBackBtn" title="赤字が曲より1行進んでいる時に押す">1行 戻す</button>';
        stageHtml += '<button class="btn" id="nudgeBackBtn" title="歌詞を0.2秒早める">−0.2s</button>';
        stageHtml += '<button class="btn" id="nudgeFwdBtn" title="歌詞を0.2秒遅らせる">+0.2s</button>';
      }
      if(lines.length > 0) stageHtml += '<button class="btn" id="copyLyricsBtn">コピー</button>';
      stageHtml += '<button class="btn" id="exportOneBtn" title="この曲のLRCとJSONを書き出す">この曲を書き出し</button>';
      stageHtml += '</div></div></div>';

      if(lines.length > 0) {
        stageHtml += '<div class="lyrics-stage"><div class="lyrics-viewport"><div class="lyrics-track" id="lyricsTrack">';
        lines.forEach(function(line) {
          stageHtml += '<div class="lyrics-line">' + line + '</div>';
        });
        stageHtml += '</div></div><div class="lyrics-fade top"></div><div class="lyrics-fade bottom"></div>';
        stageHtml += '<div class="interlude-badge" id="interludeBadge">♪ 間奏 ♪</div></div>';
      } else {
        stageHtml += '<div class="lyrics-stage"><div class="lyrics-none">歌詞がありません<br>'
          + '<span style="font-size:12px;color:var(--text-dim);line-height:1.8;">'
          + '歌詞ファイル（LRC / SRT / ASS / TXT）を<br>この画面に放り込むと入ります</span></div></div>';
      }
      document.getElementById('syncBtn').style.display = lines.length > 0 ? 'inline-flex' : 'none';
    }
    document.getElementById('stage').innerHTML = stageHtml;

    var playBtnEl = document.getElementById('panelPlayBtn');
    if(playBtnEl) playBtnEl.addEventListener('click', function() { self.playTrack(track.id); });
    var exOne = document.getElementById('exportOneBtn');
    if(exOne) exOne.addEventListener('click', function() { self.exportData(); });

    if(track && track.syncData && track.syncData.length) {
      var nudge = function(delta) {
        track.syncData = track.syncData.map(function(t) { return Math.max(0, t + delta); });
        if(track.interludes) track.interludes = track.interludes.map(function(t) { return Math.max(0, t + delta); });
        self.saveData();
        self.updateLyricsHighlight();
        self.showToast((delta < 0 ? '早めました ' : '遅らせました ') + delta.toFixed(1) + '秒');
      };
      document.getElementById('nudgeBackBtn').addEventListener('click', function() { nudge(-0.2); });
      document.getElementById('nudgeFwdBtn').addEventListener('click', function() { nudge(0.2); });

      // 行が丸ごと1個ズレている時の補正。取り直さずに直せる
      var shift = function(dir) {
        var sd = track.syncData;
        if(!sd || sd.length < 2) return;
        if(dir > 0) {
          // 表示が遅れている: 先頭に1個足して全体を後ろにずらす
          var g = sd[1] - sd[0];
          track.syncData = [Math.max(0, sd[0] - g)].concat(sd.slice(0, sd.length - 1));
        } else {
          // 表示が進んでいる: 先頭を捨てて全体を前に詰める
          var g2 = sd[sd.length - 1] - sd[sd.length - 2];
          track.syncData = sd.slice(1).concat([sd[sd.length - 1] + g2]);
        }
        self.saveData();
        self.updateLyricsHighlight();
        self.showToast(dir > 0 ? '1行 進めました' : '1行 戻しました');
      };
      document.getElementById('shiftFwdBtn').addEventListener('click', function() { shift(1); });
      document.getElementById('shiftBackBtn').addEventListener('click', function() { shift(-1); });
    }

    if(track && lines.length > 0) {
      document.getElementById('copyLyricsBtn').addEventListener('click', function() {
        var allLyrics = (track.lyrics || '').trim();
        navigator.clipboard.writeText(allLyrics).then(function() {
          self.showToast('歌詞をコピーしました');
        }).catch(function() {
          alert('コピーに失敗しました');
        });
      });
    }
  },

  updateLyricsHighlight: function() {
    var self = this;
    var track = this.state.tracks.find(function(t) { return t.id === self.state.currentId; });
    if(!track) return;
    var lyricsTrack = document.getElementById('lyricsTrack');
    if(!lyricsTrack) return;
    var lineEls = lyricsTrack.querySelectorAll('.lyrics-line');
    if(!lineEls.length) return;

    // lineEls[i] と syncData[i] は 1対1 (ダミー行なし)
    var currentTime = document.getElementById('player').currentTime;
    var sync = track.syncData;
    var currentIndex = -1;
    if(sync && sync.length) {
      var last = Math.min(sync.length, lineEls.length) - 1;
      for(var i = last; i >= 0; i--) {
        if(currentTime >= sync[i]) { currentIndex = i; break; }
      }
    }

    // 間奏中か判定: 今の行が始まった後に間奏マークを通過していたら間奏
    var inInterlude = false;
    if(currentIndex >= 0 && track.interludes && track.interludes.length) {
      for(var k = 0; k < track.interludes.length; k++) {
        var it = track.interludes[k];
        if(it >= sync[currentIndex] && currentTime >= it) { inInterlude = true; break; }
      }
    }

    // 別の曲を見ているだけの時は光らせない
    if(this.state.playingId !== this.state.currentId) { currentIndex = -1; inInterlude = false; }

    lineEls.forEach(function(el) { el.classList.remove('current', 'near', 'upcoming'); });

    if(currentIndex >= 0 && !inInterlude) {
      lineEls.forEach(function(el, idx) {
        if(idx === currentIndex) el.classList.add('current');
        else if(idx > currentIndex && idx <= currentIndex + 2) el.classList.add('near');
      });
    } else if(inInterlude) {
      // 間奏中: 歌詞は消さない。直前の行は残し、次に来る行を白ではっきり出す
      if(lineEls[currentIndex]) lineEls[currentIndex].classList.add('near');
      if(lineEls[currentIndex + 1]) lineEls[currentIndex + 1].classList.add('upcoming');
      if(lineEls[currentIndex + 2]) lineEls[currentIndex + 2].classList.add('near');
    }

    var badge = document.getElementById('interludeBadge');
    if(badge) badge.style.display = inInterlude ? 'flex' : 'none';

    // 間奏中は次の行、未再生時は1行目を中央に置く
    var focusIdx = inInterlude ? Math.min(currentIndex + 1, lineEls.length - 1) : (currentIndex >= 0 ? currentIndex : 0);
    var focusEl = lineEls[focusIdx];
    if(focusEl) {
      var viewH = lyricsTrack.parentElement.clientHeight;
      var target = focusEl.offsetTop + focusEl.offsetHeight / 2 - viewH / 2;
      lyricsTrack.style.transform = 'translateY(' + (-target) + 'px)';
    }
  },

  editTrack: function(id) {
    this.state.editingId = id;
    var track = this.state.tracks.find(function(t) { return t.id === id; });
    if(!track) return;
    document.getElementById('f-title').value = track.title;
    document.getElementById('f-album').value = track.album || '';
    document.getElementById('albumOptions').innerHTML =
      this.albumList().map(function(a) { return '<option value="' + a + '">'; }).join('');
    document.getElementById('f-lyrics').value = track.lyrics || '';
    document.getElementById('f-cover').value = '';
    document.getElementById('modalBackdrop').classList.add('open');
  },

  startSync: function() {
    var self = this;
    var track = this.state.tracks.find(function(t) { return t.id === self.state.currentId; });
    if(!track) return;
    // 別の曲が鳴っている時は、まずこの曲に切り替えてから同期する
    if(this.state.playingId !== this.state.currentId) {
      this.playTrack(this.state.currentId, function() { self.startSync(); });
      return;
    }
    var lines = (track.lyrics || '').split('\n').filter(function(l) { return l.trim(); });
    var base = (track.syncData || []).slice();   // 前回の記録。スキップ時の下敷きに使う
    var s = {lines: lines, base: base, marks: [], interludes: (track.interludes || []).slice(), log: [], index: 0};

    // 途中までしか終わっていなければ、その続きから再開する
    if(base.length > 0 && base.length < lines.length) {
      s.marks = base.slice();
      s.index = base.length;
      for(var i = 0; i < base.length; i++) s.log.push('line');
    }

    this.state.sync = s;
    document.getElementById('syncOverlay').classList.add('open');
    this.renderSyncLines();
    this.seekSync(s.index > 0 ? s.marks[s.marks.length - 1] : 0);
    this.updateSyncUI();
    if(s.index > 0) this.showToast((s.index + 1) + '行目から再開します');
    else if(base.length) this.showToast('スキップで直したい行まで進めます');
  },

  seekSync: function(t) {
    var audio = document.getElementById('player');
    audio.currentTime = Math.max(0, t || 0);
    audio.play().catch(function(){});
  },

  renderSyncLines: function() {
    if(!this.state.sync) return;
    var html = '';
    this.state.sync.lines.forEach(function(line) {
      html += '<div class="lyrics-line">' + line + '</div>';
    });
    document.getElementById('syncTrack').innerHTML = html;
  },

  updateSyncUI: function() {
    if(!this.state.sync) return;
    var s = this.state.sync;
    var done = s.index >= s.lines.length;
    var track = document.getElementById('syncTrack');
    var els = track.querySelectorAll('.lyrics-line');
    els.forEach(function(el) { el.classList.remove('current', 'near', 'upcoming'); });

    // 直前にタップした行 = 今まさに歌われている → 赤 (プレイヤーと同じ意味)
    if(s.index > 0 && els[s.index - 1]) els[s.index - 1].classList.add('current');
    // 次にタップする行 = まだ歌われていない → 白
    if(!done && els[s.index]) els[s.index].classList.add('upcoming');
    if(els[s.index + 1]) els[s.index + 1].classList.add('near');

    // 主役は「今歌っている行」= 赤字。これを常に中央に置く
    var focus = els[s.index > 0 ? s.index - 1 : 0];
    if(focus) {
      var target = focus.offsetTop + focus.offsetHeight / 2 - track.parentElement.clientHeight / 2;
      track.style.transform = 'translateY(' + (-target) + 'px)';
    }

    document.getElementById('syncTapBtn').style.display = done ? 'none' : 'flex';
    document.getElementById('syncHint').textContent = done ? '完了 — ✕ を押すと保存されます'
      : (s.index === 0 ? '1行目が歌い出された瞬間にタップ' : '赤い行の次が歌い出された瞬間にタップ');
    var prog = (done ? s.lines.length : s.index + 1) + ' / ' + s.lines.length;
    if(s.interludes.length) prog += '　　♪ 間奏 ' + s.interludes.length + '箇所';
    document.getElementById('syncProgress').textContent = prog;
  },

  // ===== Google Drive 同期 =====
  drive: {
    SCOPE: 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.readonly',
    FOLDER_NAME: 'KNOX Player',
    AUDIO_FOLDER: 'KNOX 音源',
    LIB_NAME: 'library.json',
    token: null, expiresAt: 0, tokenClient: null, folderId: null, pending: null,

    clientId: function() {
      // 埋め込みを最優先。端末ごとに違うIDが残っていても必ず統一される
      var embedded = (window.KNOX_CLIENT_ID || '').trim();
      if(embedded) return embedded;
      try { return (localStorage.getItem('knox_client_id') || '').trim(); } catch(e) { return ''; }
    },
    isEmbedded: function() { return !!(window.KNOX_CLIENT_ID || '').trim(); },
    setClientId: function(v) { try { localStorage.setItem('knox_client_id', v.trim()); } catch(e) {} },
    isLocalFile: function() { return location.protocol === 'file:'; },
    gisReady: function() { return typeof google !== 'undefined' && google.accounts && google.accounts.oauth2; },

    auth: function(cb, err) {
      var self = this;
      if(this.token && Date.now() < this.expiresAt - 60000) { cb(this.token); return; }
      if(this.isLocalFile()) { err('この機能はネット上に置いてから使えます（ローカルのファイルでは Google 認証ができません）'); return; }
      if(!this.clientId()) { err('クライアントIDが未設定です'); return; }
      if(!this.gisReady()) { err('Googleの認証スクリプトを読み込めませんでした'); return; }
      if(!this.tokenClient) {
        this.tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: this.clientId(), scope: this.SCOPE,
          callback: function(resp) {
            var p = self.pending; self.pending = null;
            if(!p) return;
            if(resp.error) { p.err('認証できませんでした: ' + resp.error); return; }
            self.token = resp.access_token;
            self.expiresAt = Date.now() + ((resp.expires_in || 3600) * 1000);
            p.cb(self.token);
          },
          error_callback: function(e) {
            var p = self.pending; self.pending = null;
            if(p) p.err('認証が中断されました');
          }
        });
      }
      this.pending = {cb: cb, err: err};
      this.tokenClient.requestAccessToken({prompt: this.token ? '' : 'consent'});
    },

    api: function(url, opts, cb, err) {
      this.auth(function(tok) {
        opts = opts || {};
        opts.headers = opts.headers || {};
        opts.headers['Authorization'] = 'Bearer ' + tok;
        fetch(url, opts).then(function(r) {
          if(!r.ok) return r.text().then(function(t) { throw new Error(r.status + ' ' + t.slice(0, 200)); });
          return r.json();
        }).then(cb).catch(function(e) { err(e.message); });
      }, err);
    },

    ensureFolder: function(cb, err) {
      var self = this;
      if(this.folderId) { cb(this.folderId); return; }
      var q = "mimeType='application/vnd.google-apps.folder' and name='" + this.FOLDER_NAME + "' and trashed=false";
      this.api('https://www.googleapis.com/drive/v3/files?q=' + encodeURIComponent(q) + '&fields=files(id,name)', {}, function(res) {
        if(res.files && res.files.length) { self.folderId = res.files[0].id; cb(self.folderId); return; }
        self.api('https://www.googleapis.com/drive/v3/files?fields=id', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({name: self.FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder'})
        }, function(f) { self.folderId = f.id; cb(f.id); }, err);
      }, err);
    },

    // 手で放り込む用のフォルダ。読み取り権限があるので中身が見える
    ensureAudioFolder: function(cb, err) {
      var self = this;
      if(this.audioFolderId) { cb(this.audioFolderId); return; }
      var q = "mimeType='application/vnd.google-apps.folder' and name='" + this.AUDIO_FOLDER + "' and trashed=false";
      this.api('https://www.googleapis.com/drive/v3/files?q=' + encodeURIComponent(q) + '&fields=files(id,name)', {}, function(res) {
        if(res.files && res.files.length) { self.audioFolderId = res.files[0].id; cb(self.audioFolderId); return; }
        self.api('https://www.googleapis.com/drive/v3/files?fields=id', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({name: self.AUDIO_FOLDER, mimeType: 'application/vnd.google-apps.folder'})
        }, function(f) { self.audioFolderId = f.id; cb(f.id); }, err);
      }, err);
    },

    listById: function(fid, cb, err) {
      var q = "'" + fid + "' in parents and trashed=false";
      this.api('https://www.googleapis.com/drive/v3/files?q=' + encodeURIComponent(q) +
               '&fields=files(id,name,mimeType)&pageSize=1000', {}, function(res) { cb(res.files || []); }, err);
    },

    listAudioFolder: function(cb, err) {
      var self = this;
      this.ensureAudioFolder(function(fid) {
        var q = "'" + fid + "' in parents and trashed=false";
        self.api('https://www.googleapis.com/drive/v3/files?q=' + encodeURIComponent(q) +
                 '&fields=files(id,name,size,mimeType)&pageSize=1000', {}, function(res) {
          cb(res.files || []);
        }, err);
      }, err);
    },

    findInFolder: function(name, cb, err) {
      var self = this;
      this.ensureFolder(function(fid) {
        var q = "name='" + name + "' and '" + fid + "' in parents and trashed=false";
        self.api('https://www.googleapis.com/drive/v3/files?q=' + encodeURIComponent(q) + '&fields=files(id,name)', {}, function(res) {
          cb(res.files && res.files.length ? res.files[0].id : null);
        }, err);
      }, err);
    },

    // 小さいJSON用（multipart）
    putJson: function(name, obj, cb, err) {
      var self = this;
      this.findInFolder(name, function(existingId) {
        self.ensureFolder(function(fid) {
          self.auth(function(tok) {
            var meta = existingId ? {name: name} : {name: name, parents: [fid]};
            var b = '-------knox\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'
                  + JSON.stringify(meta)
                  + '\r\n-------knox\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'
                  + JSON.stringify(obj) + '\r\n-------knox--';
            var url = 'https://www.googleapis.com/upload/drive/v3/files' + (existingId ? '/' + existingId : '') + '?uploadType=multipart&fields=id';
            fetch(url, {
              method: existingId ? 'PATCH' : 'POST',
              headers: {'Authorization': 'Bearer ' + tok, 'Content-Type': 'multipart/related; boundary=-----knox'},
              body: b
            }).then(function(r) {
              if(!r.ok) return r.text().then(function(t) { throw new Error(r.status + ' ' + t.slice(0, 200)); });
              return r.json();
            }).then(function(f) { cb(f.id); }).catch(function(e) { err(e.message); });
          }, err);
        }, err);
      }, err);
    },

    // 音源用（resumable: 大きいファイルでも通る）
    putBlob: function(name, blob, cb, err) {
      var self = this;
      this.findInFolder(name, function(existingId) {
        self.ensureFolder(function(fid) {
          self.auth(function(tok) {
            var meta = existingId ? {name: name} : {name: name, parents: [fid]};
            var url = 'https://www.googleapis.com/upload/drive/v3/files' + (existingId ? '/' + existingId : '') + '?uploadType=resumable&fields=id';
            fetch(url, {
              method: existingId ? 'PATCH' : 'POST',
              headers: {'Authorization': 'Bearer ' + tok, 'Content-Type': 'application/json; charset=UTF-8',
                        'X-Upload-Content-Type': blob.type || 'audio/mpeg'},
              body: JSON.stringify(meta)
            }).then(function(r) {
              var loc = r.headers.get('Location');
              if(!loc) throw new Error('アップロードを開始できませんでした');
              return fetch(loc, {method: 'PUT', headers: {'Content-Type': blob.type || 'audio/mpeg'}, body: blob});
            }).then(function(r) {
              if(!r.ok) return r.text().then(function(t) { throw new Error(r.status + ' ' + t.slice(0, 200)); });
              return r.json();
            }).then(function(f) { cb(f.id); }).catch(function(e) { err(e.message); });
          }, err);
        }, err);
      }, err);
    },

    getBlob: function(fileId, cb, err) {
      this.auth(function(tok) {
        fetch('https://www.googleapis.com/drive/v3/files/' + fileId + '?alt=media', {headers: {'Authorization': 'Bearer ' + tok}})
          .then(function(r) { if(!r.ok) throw new Error('取得できませんでした (' + r.status + ')'); return r.blob(); })
          .then(cb).catch(function(e) { err(e.message); });
      }, err);
    },

    getJson: function(fileId, cb, err) {
      this.auth(function(tok) {
        fetch('https://www.googleapis.com/drive/v3/files/' + fileId + '?alt=media', {headers: {'Authorization': 'Bearer ' + tok}})
          .then(function(r) { if(!r.ok) throw new Error('取得できませんでした (' + r.status + ')'); return r.json(); })
          .then(cb).catch(function(e) { err(e.message); });
      }, err);
    }
  },

  driveLog: function(msg) {
    var el = document.getElementById('driveLog');
    if(el) el.textContent += (el.textContent ? '\n' : '') + msg;
  },

  openDriveStatus: function() {
    var withAudio = this.state.tracks.filter(function(t) { return t.hasAudio !== false; }).length;
    var el = document.getElementById('driveStatus');
    if(el) el.innerHTML = 'サインイン: 済み<br>この端末の曲数: ' + this.state.tracks.length + '曲（うち音源あり ' + withAudio + '曲）';
  },

  openDrive: function() {
    document.getElementById('driveLog').textContent = '';
    var idField = document.getElementById('f-clientid');
    idField.value = this.drive.clientId();
    idField.readOnly = this.drive.isEmbedded();
    document.getElementById('saveClientIdBtn').style.display = this.drive.isEmbedded() ? 'none' : 'inline-flex';
    var st = [];
    if(this.drive.isLocalFile()) st.push('⚠ いまローカルのファイルを開いています。Drive連携は knox-band.jp に置いてからお使いください。');
    st.push('バージョン: ' + this.VERSION);
    st.push('クライアントID: ' + (this.drive.isEmbedded() ? '埋め込み済み（入力不要）' : (this.drive.clientId() ? 'この端末で設定済み' : '未設定')));
    st.push('保存先: Google ドライブの「KNOX Player」フォルダ');
    st.push('サインイン: ' + (this.drive.token && Date.now() < this.drive.expiresAt ? '済み' : 'まだ'));
    var withAudio = this.state.tracks.filter(function(t) { return t.hasAudio !== false; }).length;
    st.push('この端末の曲数: ' + this.state.tracks.length + '曲（うち音源あり ' + withAudio + '曲）');
    if(this.state.tracks.length && withAudio < this.state.tracks.length) {
      st.push('<span style="color:var(--accent)">⚠ 音源が無い曲が ' + (this.state.tracks.length - withAudio) + '曲あります。mp3をドラッグしてから保存してください</span>');
    }
    document.getElementById('driveStatus').innerHTML = st.join('<br>');
    document.getElementById('driveBackdrop').classList.add('open');
  },

  driveSignIn: function() {
    var self = this;
    this.driveLog('Googleにサインインしています…');
    this.drive.auth(function() {
      self.driveLog('サインインできました。「Driveへ保存」または「Driveから取り込み」を押してください');
    }, function(m) { self.driveLog('エラー: ' + m); });
  },

  // 端末 → Drive
  driveUpload: function() {
    var self = this;
    var fail = function(m) { self.driveLog('エラー: ' + m); };
    if(!this.state.tracks.length) { this.driveLog('曲がありません'); return; }
    this.driveLog('Driveに接続しています…');
    // 認証のポップアップはクリック直後でないとブラウザに塞がれるので、ここで先に済ませる
    this.drive.auth(function() { self.driveUploadGo(); }, fail);
  },

  driveUploadGo: function() {
    var self = this;
    var fail = function(m) { self.driveLog('エラー: ' + m); };

    var missing = this.state.tracks.filter(function(t) { return t.hasAudio === false; });
    if(missing.length) {
      this.driveLog('※ 音源が入っていない曲が ' + missing.length + '曲あります（' + missing.slice(0,3).map(function(t){return t.title;}).join('、') + (missing.length>3?' ほか':'') + '）');
      this.driveLog('※ これらは曲名と歌詞だけが保存されます。音源も上げるには、mp3をこの画面にドラッグしてから、もう一度「Driveへ保存」を押してください');
    }
    var queue = this.state.tracks.filter(function(t) { return t.hasAudio !== false && !t.driveAudioId; });
    var sent = 0;
    var i = 0;
    var nextAudio = function() {
      if(i >= queue.length) { uploadLibrary(); return; }
      var track = queue[i++];
      self.driveLog('音源を送信: ' + track.title + '  (' + i + '/' + queue.length + ')');
      var req = self.db.transaction('tracks', 'readonly').objectStore('tracks').get(track.id);
      req.onsuccess = function() {
        var rec = req.result;
        if(!rec || !rec.audio) { nextAudio(); return; }
        self.drive.putBlob(track.id + '.mp3', rec.audio, function(fileId) {
          track.driveAudioId = fileId;
          sent++;
          nextAudio();
        }, fail);
      };
    };
    var uploadLibrary = function() {
      var lib = {
        app: 'KNOX PLAYER', version: 1, exportedAt: new Date().toISOString(),
        tracks: self.state.tracks.map(function(t) {
          return {id: t.id, title: t.title, album: t.album, lyrics: t.lyrics || '',
                  syncData: t.syncData || [], interludes: t.interludes || [],
                  driveAudioId: t.driveAudioId || null, cover: self.state.covers[t.id] || null};
        })
      };
      self.driveLog('曲目リストを送信…');
      var withAudio = self.state.tracks.filter(function(t) { return !!t.driveAudioId; }).length;
      self.drive.putJson(self.drive.LIB_NAME, lib, function() {
        self.saveData();
        self.driveLog('完了: 曲目リスト ' + self.state.tracks.length + '曲 / 今回送った音源 ' + sent + '件');
        self.driveLog('Drive上で音源が揃っている曲: ' + withAudio + ' / ' + self.state.tracks.length + '曲');
        if(withAudio < self.state.tracks.length) {
          self.driveLog('⚠ 音源が足りていません。他の端末では音が出ません。mp3をドラッグしてから、もう一度「Driveへ保存」を押してください');
          self.showToast('曲目リストは保存しましたが、音源が足りません');
        } else {
          self.showToast('Driveに保存しました');
        }
        self.openDriveStatus();
      }, fail);
    };
    nextAudio();
  },

  // Drive → 端末（音源は再生時に落とす）
  driveDownload: function() {
    var self = this;
    var fail = function(m) { self.driveLog('エラー: ' + m); };
    this.driveLog('Driveを確認しています…');
    this.drive.auth(function() { self.driveDownloadGo(); }, fail);
  },

  driveDownloadGo: function() {
    var self = this;
    var fail = function(m) { self.driveLog('エラー: ' + m); };
    this.drive.findInFolder(this.drive.LIB_NAME, function(fileId) {
      if(!fileId) {
        self.driveLog('曲目リストはまだありません。音源フォルダだけ見ます');
        self.scanAudioFolder();
        return;
      }
      self.drive.getJson(fileId, function(lib) {
        if(!lib || !Array.isArray(lib.tracks)) { fail('データの形式が読めません'); return; }
        self.driveLog(lib.tracks.length + '曲ぶんの歌詞と同期データを取り込みます');
        self.restoreLibrary(lib, true);
        self.scanAudioFolder();
      }, fail);
    }, fail);
  },

  // 「KNOX 音源」の中を見る。サブフォルダはアルバムとして扱う
  scanAudioFolder: function() {
    var self = this;
    var fail = function(m) { self.driveLog('エラー: ' + m); };
    var FOLDER = 'application/vnd.google-apps.folder';
    var isImage = function(f) { return /\.(jpg|jpeg|png|webp|gif)$/i.test(f.name) || (f.mimeType || '').indexOf('image/') === 0; };
    var isLyric = function(f) { return self.isLyricFile(f.name); };
    var isJunk = function(f) { return /\.(json|md|html?|css|js|csv|zip|pdf|docx?|xlsx?|ini)$/i.test(f.name) || isLyric(f); };
    var lyricQueue = [];

    this.driveLog('Driveの「' + this.drive.AUDIO_FOLDER + '」を見ています…');
    this.drive.listAudioFolder(function(entries) {
      var folders = entries.filter(function(f) { return f.mimeType === FOLDER; });
      var loose = entries.filter(function(f) { return f.mimeType !== FOLDER && !isImage(f) && !isJunk(f); });
      var linked = 0, added = 0, albums = [];

      var attach = function(files, album) {
        files.forEach(function(f) {
          var base = f.name.replace(/\.[^.]+$/, '');
          var track = self.findTrackByName(base, false);
          if(track) {
            track.driveAudioId = f.id;
            if(album) track.album = album;
            linked++;
          } else {
            self.state.tracks.push({id: self.genId(), title: base, album: album || self.OTHER, lyrics: '',
              syncData: null, interludes: [], hasAudio: false, driveAudioId: f.id});
            added++;
          }
        });
      };

      attach(loose, null);
      entries.filter(isLyric).forEach(function(f) { lyricQueue.push(f); });

      var fi = 0;
      var nextFolder = function() {
        if(fi >= folders.length) { pullLyrics(); return; }
        var folder = folders[fi++];
        self.driveLog('アルバム「' + folder.name + '」を読み込み中…');
        albums.push(folder.name);
        self.drive.listById(folder.id, function(items) {
          attach(items.filter(function(f) { return f.mimeType !== FOLDER && !isImage(f) && !isJunk(f); }), folder.name);
          items.filter(isLyric).forEach(function(f) { lyricQueue.push(f); });
          var art = items.find(isImage);
          if(art && !self.state.albumCovers[folder.name]) {
            self.drive.getBlob(art.id, function(blob) {
              var r = new FileReader();
              r.onload = function(e) { self.state.albumCovers[folder.name] = e.target.result; self.saveAlbumCovers(); nextFolder(); };
              r.readAsDataURL(blob);
            }, function() { nextFolder(); });
          } else { nextFolder(); }
        }, fail);
      };

      // 歌詞ファイル（LRC / SRT / ASS / VTT / TXT）も拾って、曲名が合う曲へ入れる
      var lyricsIn = 0, lyricsTimed = 0, lyricsMiss = [];
      var li = 0;
      var pullLyrics = function() {
        if(li >= lyricQueue.length) { finish(); return; }
        var f = lyricQueue[li++];
        if(!self.findTrackByName(self.lyricBase(f.name), false)) { lyricsMiss.push(f.name); pullLyrics(); return; }
        if(li === 1) self.driveLog('歌詞ファイルを読み込み中…');
        self.drive.getBlob(f.id, function(blob) {
          self.readLyricBlob(blob, function(text) {
            var track = text === null ? null : self.findTrackByName(self.lyricBase(f.name), false);
            var parsed = track ? self.parseLyricFile(f.name, text) : null;
            if(track && parsed) {
              track.lyrics = parsed.lyrics;
              if(parsed.syncData.length) { track.syncData = parsed.syncData; lyricsTimed++; }
              lyricsIn++;
            } else { lyricsMiss.push(f.name); }
            pullLyrics();
          });
        }, function() { lyricsMiss.push(f.name); pullLyrics(); });
      };

      var reportLyrics = function() {
        if(lyricsIn) {
          self.driveLog('歌詞を入れました: ' + lyricsIn + '曲'
            + (lyricsTimed ? '（うち' + lyricsTimed + '曲はタイミング付き＝同期の手作業なし）' : ''));
        }
        if(lyricsMiss.length) self.driveLog('曲名が合わず入れられなかった歌詞: ' + lyricsMiss.join('、'));
      };

      var finish = function() {
        if(!linked && !added && !lyricsIn) {
          self.driveLog('「' + self.drive.AUDIO_FOLDER + '」には音源が見つかりませんでした');
          reportLyrics();
          self.driveLog('完了。アルバム名のフォルダを作って、その中に音源・ジャケット画像・歌詞ファイル（LRC/SRT/ASS/TXT）を入れておけば、次から自動で取り込みます');
          self.render();
          return;
        }
        self.saveData();
        self.render();
        if(linked || added) self.driveLog('音源をひも付けました: ' + linked + '曲' + (added ? ' / 新規 ' + added + '曲' : ''));
        reportLyrics();
        if(albums.length) self.driveLog('アルバム: ' + albums.join('、'));
        self.driveLog('完了。曲をタップすれば、その場で音源が降りてきます');
        self.showToast('Driveから読み込みました');
      };

      nextFolder();
    }, fail);
  },

  // 音源が端末に無ければ Drive から取ってきて保存する
  fetchAudioFromDrive: function(track, cb, err) {
    var self = this;
    this.showToast('Driveから音源を取得しています…');
    this.drive.getBlob(track.driveAudioId, function(blob) {
      var store = self.db.transaction('tracks', 'readwrite').objectStore('tracks');
      var g = store.get(track.id);
      g.onsuccess = function() {
        var rec = g.result || {id: track.id};
        rec.audio = blob; rec.title = track.title; rec.album = track.album;
        rec.lyrics = track.lyrics; rec.syncData = track.syncData;
        rec.interludes = track.interludes || []; rec.driveAudioId = track.driveAudioId;
        store.put(rec).onsuccess = function() { track.hasAudio = true; cb(blob); };
      };
    }, err);
  },

  // 全曲の歌詞・同期データを1ファイルに（音源は含まない）
  exportLibrary: function() {
    var self = this;
    if(!this.state.tracks.length) { alert('曲がありません'); return; }
    var data = {
      app: 'KNOX PLAYER', version: 1, exportedAt: new Date().toISOString(),
      tracks: this.state.tracks.map(function(t) {
        return {
          id: t.id, title: t.title, album: t.album,
          lyrics: t.lyrics || '',
          syncData: t.syncData || [],
          interludes: t.interludes || [],
          driveAudioId: t.driveAudioId || null,
          cover: self.state.covers[t.id] || null
        };
      })
    };
    var stamp = new Date().toISOString().slice(0, 10);
    this.downloadFile('KNOX-PLAYER-backup-' + stamp + '.json', JSON.stringify(data), 'application/json;charset=utf-8');
    this.showToast(this.state.tracks.length + '曲を書き出しました（音源は含みません）');
  },

  restoreLibrary: function(data, silent) {
    var self = this;
    if(!silent && !confirm('バックアップから ' + data.tracks.length + '曲を復元します。\n同じ曲がある場合は歌詞と同期データが上書きされます。よろしいですか？')) return;
    var added = 0, updated = 0;
    data.tracks.forEach(function(item) {
      if(!item || !item.title) return;
      // 曲名の (after 〜) や曲番号の違いを無視して照合する。二重登録を防ぐ
      var found = self.state.tracks.find(function(t) { return t.id === item.id; })
               || self.findTrackByName(item.title, false);
      var album = self.normalizeAlbum(item.album);
      if(found) {
        // 中身のあるものだけ上書きする。空で既存の歌詞や同期を消さない
        if(typeof item.lyrics === 'string' && item.lyrics.trim()) found.lyrics = item.lyrics;
        if(Array.isArray(item.syncData) && item.syncData.length) found.syncData = item.syncData;
        if(Array.isArray(item.interludes) && item.interludes.length) found.interludes = item.interludes;
        if(item.album) found.album = self.normalizeAlbum(item.album);
        if(item.title && item.title.length > (found.title || '').length) found.title = item.title;
        if(item.driveAudioId) found.driveAudioId = item.driveAudioId;
        if(item.cover) self.state.covers[found.id] = item.cover;
        updated++;
      } else {
        var id = item.id || self.genId();
        self.state.tracks.push({
          id: id, title: item.title, album: album,
          lyrics: item.lyrics || '',
          syncData: (Array.isArray(item.syncData) && item.syncData.length) ? item.syncData : null,
          interludes: Array.isArray(item.interludes) ? item.interludes : [],
          hasAudio: false,
          driveAudioId: item.driveAudioId || null
        });
        if(item.cover) self.state.covers[id] = item.cover;
        added++;
      }
    });
    this.saveData();
    this.render();
    this.updateLyricsHighlight();
    if(!silent) this.showToast('復元しました（新規 ' + added + '曲 / 更新 ' + updated + '曲）');
  },

  // 1曲ぶんのJSON（この曲を書き出し で作ったもの）を選択中の曲に取り込む
  importOneTrack: function(data) {
    var self = this;
    var track = this.state.tracks.find(function(t) { return t.id === self.state.currentId; });
    if(!track) { alert('先に曲を選択してください'); return; }
    if(!confirm('「' + (data.title || '?') + '」の歌詞と同期データを\n選択中の「' + track.title + '」に取り込みます。よろしいですか？')) return;
    if(typeof data.lyrics === 'string') track.lyrics = data.lyrics;
    if(Array.isArray(data.syncData) && data.syncData.length) track.syncData = data.syncData;
    track.interludes = Array.isArray(data.interludes) ? data.interludes : [];
    this.saveData();
    this.render();
    this.updateLyricsHighlight();
    this.showToast('読み込みました');
  },

  exportData: function() {
    var self = this;
    var track = this.state.tracks.find(function(t) { return t.id === self.state.currentId; });
    if(!track) { alert('曲を選択してください'); return; }

    var lines = (track.lyrics || '').split('\n').filter(function(l) { return l.trim(); });
    var lrc = '[ti:' + track.title + ']\n[al:' + (track.album || '') + ']\n\n';
    if(track.syncData && track.syncData.length === lines.length) {
      lines.forEach(function(line, idx) {
        var time = track.syncData[idx];
        var m = Math.floor(time / 60);
        var s = Math.floor(time % 60);
        var ms = Math.floor((time % 1) * 100);
        lrc += '[' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s + '.' + (ms < 10 ? '0' : '') + ms + ']' + line + '\n';
      });
    } else {
      lines.forEach(function(line) { lrc += line + '\n'; });
    }
    this.downloadFile(track.title + '.lrc', lrc, 'text/plain;charset=utf-8');

    setTimeout(function() {
      var json = {title: track.title, album: track.album, lyrics: track.lyrics, syncData: track.syncData || [], interludes: track.interludes || []};
      app.downloadFile(track.title + '.json', JSON.stringify(json, null, 2), 'application/json;charset=utf-8');
    }, 200);
  },

  downloadFile: function(filename, content, mime) {
    var blob = new Blob([content], {type: mime});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  },

  toggleAlbum: function(album) {
    this.state.collapsed[album] = !this.state.collapsed[album];
    this.render();
  },

  saveData: function() {
    var self = this;
    this.savePlaylists();
    this.saveAlbumCovers();
    this.state.tracks.forEach(function(track) {
      var tx = self.db.transaction('tracks', 'readwrite');
      var store = tx.objectStore('tracks');
      var req = store.get(track.id);

      req.onsuccess = function() {
        var data = req.result || {id: track.id, audio: null};
        data.title = track.title;
        data.album = track.album;
        data.lyrics = track.lyrics;
        data.syncData = track.syncData;
        data.interludes = track.interludes || [];
        data.driveAudioId = track.driveAudioId || null;

        if(self.state.covers[track.id]) {
          data.cover = self.state.covers[track.id];
        }

        store.put(data);
      };
    });
  },

  loadData: function(callback) {
    var self = this;
    var tx = this.db.transaction('tracks', 'readonly');
    var store = tx.objectStore('tracks');
    var req = store.getAll();

    req.onsuccess = function() {
      var data = req.result;
      var meta = data.find(function(it) { return it.id === '__playlists__'; });
      self.state.playlists = (meta && Array.isArray(meta.playlists)) ? meta.playlists : [];
      var ac = data.find(function(it) { return it.id === '__albumcovers__'; });
      self.state.albumCovers = (ac && ac.albumCovers) ? ac.albumCovers : {};
      data = data.filter(function(it) { return it.id !== '__playlists__' && it.id !== '__albumcovers__'; });
      self.state.tracks = data.map(function(item) {
        if(item.cover) self.state.covers[item.id] = item.cover;
        return {
          id: item.id,
          title: item.title,
          lyrics: item.lyrics,
          syncData: item.syncData,
          interludes: item.interludes || [],
          album: self.normalizeAlbum(item.album),
          hasAudio: !!item.audio,
          driveAudioId: item.driveAudioId || null
        };
      });
      if(callback) callback();
    };
  },

  showToast: function(message) {
    var toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(function() {
      toast.style.opacity = '0';
      toast.style.transition = 'opacity .3s';
      setTimeout(function() { document.body.removeChild(toast); }, 300);
    }, 2000);
  },

  fmtTime: function(sec) {
    if(!isFinite(sec) || sec < 0) sec = 0;
    var m = Math.floor(sec / 60);
    var s = Math.floor(sec % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  },

  genId: function() {
    return 't_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
};

app.init();
</script>
